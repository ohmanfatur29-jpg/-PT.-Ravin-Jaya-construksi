<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portofolio Proyek | PT. RAVIN JAYA KONSTRUKSI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="main-navbar"></header>

  <section class="bg-[#0B192C] blueprint-grid text-white py-14 border-b-4 border-amber-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <span class="text-amber-400 text-xs font-bold uppercase tracking-widest">Rekam Jejak Pekerjaan</span>
      <h1 class="font-display font-extrabold text-4xl sm:text-5xl uppercase mt-1">Portofolio Proyek Konstruksi</h1>
      <p class="text-slate-300 text-sm sm:text-base mt-2 max-w-2xl">Daftar hasil pengerjaan proyek gedung, renovasi, jalan, dan infrastruktur sipil oleh PT. Ravin Jaya Konstruksi.</p>
    </div>
  </section>

  <section class="py-12 bg-slate-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-wrap gap-2 mb-10" id="portfolio-filters">
        <button data-cat="Semua" class="filter-btn bg-[#0B192C] text-amber-400 px-5 py-2.5 rounded font-bold text-xs uppercase tracking-wider">Semua Proyek</button>
        <button data-cat="Gedung" class="filter-btn bg-white text-slate-700 border border-slate-300 hover:border-amber-500 px-5 py-2.5 rounded font-bold text-xs uppercase tracking-wider">Pembangunan Gedung</button>
        <button data-cat="Renovasi" class="filter-btn bg-white text-slate-700 border border-slate-300 hover:border-amber-500 px-5 py-2.5 rounded font-bold text-xs uppercase tracking-wider">Renovasi</button>
        <button data-cat="Jalan" class="filter-btn bg-white text-slate-700 border border-slate-300 hover:border-amber-500 px-5 py-2.5 rounded font-bold text-xs uppercase tracking-wider">Pembangunan Jalan</button>
        <button data-cat="Sipil" class="filter-btn bg-white text-slate-700 border border-slate-300 hover:border-amber-500 px-5 py-2.5 rounded font-bold text-xs uppercase tracking-wider">Infrastruktur & Sipil</button>
      </div>

      <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </div>
  </section>

  <div id="main-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    function renderPortfolio(category = "Semua") {
      const grid = document.getElementById("portfolio-grid");
      const filtered = category === "Semua" 
        ? PROJECT_PHOTOS.slice(0, 18) 
        : PROJECT_PHOTOS.filter(p => p.category === category);

      grid.innerHTML = filtered.map(p => `
        <article class="bg-white border border-slate-200 rounded-sm overflow-hidden shadow-sm hover:shadow-xl transition flex flex-col">
          <div class="relative h-60 bg-slate-200 overflow-hidden">
            <img src="${getDriveImageUrl(p.id, 'w800')}" 
                 onerror="handleMediaError(this, '${p.id}.jpg')" 
                 alt="${p.title}" class="w-full h-full object-cover hover:scale-105 transition duration-500">
            <span class="absolute top-3 left-3 bg-amber-500 text-[#0B192C] text-xs font-extrabold px-3 py-1 uppercase">
              ${p.category}
            </span>
          </div>
          <div class="p-6 flex-1 flex flex-col justify-between">
            <div>
              <div class="text-xs font-semibold text-amber-600 mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-location-dot"></i> ${p.location}
              </div>
              <h3 class="font-display font-bold text-2xl text-[#0B192C] leading-snug mb-2">${p.title}</h3>
              <p class="text-sm text-slate-600 leading-relaxed">${p.desc}</p>
            </div>
            <div class="mt-5 pt-4 border-t border-slate-100 flex justify-between items-center text-xs">
              <span class="font-bold text-emerald-700"><i class="fa-solid fa-circle-check"></i> Selesai / Terverifikasi</span>
              <a href="kontak.html" class="font-bold text-[#0B192C] hover:text-amber-600">Tanya Proyek Serupa →</a>
            </div>
          </div>
        </article>
      `).join("");
    }

    document.addEventListener("DOMContentLoaded", () => {
      renderPortfolio("Semua");

      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".filter-btn").forEach(b => {
            b.className = "filter-btn bg-white text-slate-700 border border-slate-300 hover:border-amber-500 px-5 py-2.5 rounded font-bold text-xs uppercase tracking-wider";
          });
          btn.className = "filter-btn bg-[#0B192C] text-amber-400 px-5 py-2.5 rounded font-bold text-xs uppercase tracking-wider";
          renderPortfolio(btn.dataset.cat);
        });
      });
    });
  </script>
</body>
</html>
