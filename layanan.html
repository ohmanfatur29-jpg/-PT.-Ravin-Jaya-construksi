<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layanan Kami | PT. RAVIN JAYA KONSTRUKSI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="main-navbar"></header>

  <section class="bg-[#0B192C] blueprint-grid text-white py-14 border-b-4 border-amber-500">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <span class="text-amber-400 text-xs font-bold uppercase tracking-widest">Bidang Usaha</span>
      <h1 class="font-display font-extrabold text-4xl sm:text-5xl uppercase mt-1">Layanan Konstruksi Kami</h1>
      <p class="text-slate-300 text-sm sm:text-base mt-2 max-w-2xl">Cakupan layanan lengkap mulai dari perencanaan struktur, pelaksanaan fisik, hingga pemeliharaan bangunan.</p>
    </div>
  </section>

  <section class="py-16 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12" id="services-list"></div>
  </section>

  <div id="main-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const services = [
        {
          title: "1. Jasa Pembangunan Gedung",
          photo: PROJECT_PHOTOS[0],
          icon: "fa-city",
          desc: "Melayani pembangunan gedung dari tahap persiapan lahan, pekerjaan pondasi, struktur beton bertulang, konstruksi baja berat, hingga finishing arsitektural dan Mekanikal Elektrikal Plumbing (MEP).",
          scopes: ["Gedung Perkantoran & Instansi", "Gudang Industri & Pabrik Bentang Lebar", "Ruko, Toko & Bangunan Komersial", "Fasilitas Pendidikan & Gedung Serbaguna"]
        },
        {
          title: "2. Renovasi Bangunan",
          photo: PROJECT_PHOTOS[9],
          icon: "fa-trowel-bricks",
          desc: "Solusi peremajaan dan pengembangan bangunan lama menjadi lebih modern, aman, dan fungsional tanpa mengganggu stabilitas struktur utama.",
          scopes: ["Renovasi Total maupun Sebagian", "Penambahan Lantai & Perkuatan Struktur", "Peremajaan Fasad Gedung & Atap Baja", "Penataan Ulang Interior Kantor & Komersial"]
        },
        {
          title: "3. Pembangunan Jalan",
          photo: PROJECT_PHOTOS[6],
          icon: "fa-road",
          desc: "Pengerjaan infrastruktur jalan lingkungan, akses kawasan industri, maupun jalan penghubung antar wilayah dengan daya tahan beban kendaraan berat.",
          scopes: ["Pengecoran Jalan Beton (Rigid Pavement)", "Pengaspalan Hotmix & Lapis Penetrasi", "Pemasangan Paving Block K-300 / K-400", "Pekerjaan Bahu Jalan & Marka"]
        },
        {
          title: "4. Infrastruktur dan Sipil",
          photo: PROJECT_PHOTOS[10],
          icon: "fa-bridge",
          desc: "Pekerjaan teknik sipil berskala menengah hingga besar untuk mendukung ketahanan lingkungan dan konektivitas wilayah.",
          scopes: ["Pembangunan Jembatan & Box Culvert", "Saluran Drainase & Gorong-Gorong", "Dinding Penahan Tanah (Talud & Bronjong)", "Pekerjaan Tanah (Cut & Fill) & Pematangan Lahan"]
        }
      ];

      document.getElementById("services-list").innerHTML = services.map((s, i) => `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center bg-slate-50 p-6 sm:p-8 border border-slate-200 rounded-sm shadow-sm">
          <div class="lg:col-span-5 ${i % 2 === 1 ? 'lg:order-2' : ''}">
            <div class="construction-frame">
              <img src="${getDriveImageUrl(s.photo.id, 'w800')}" 
                   onerror="handleMediaError(this, '${s.photo.id}.jpg')" 
                   alt="${s.title}" class="w-full h-64 object-cover">
            </div>
          </div>
          <div class="lg:col-span-7 space-y-4">
            <div class="inline-flex items-center gap-2 text-amber-600 font-bold text-sm">
              <i class="fa-solid ${s.icon} text-xl"></i> SPESIALISASI UTAMA
            </div>
            <h2 class="font-display font-extrabold text-3xl text-[#0B192C] uppercase">${s.title}</h2>
            <p class="text-slate-600 text-sm sm:text-base leading-relaxed">${s.desc}</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2">
              ${s.scopes.map(item => `
                <div class="flex items-center gap-2 bg-white p-2.5 border border-slate-200 text-xs font-semibold text-slate-800">
                  <i class="fa-solid fa-check text-amber-500"></i> ${item}
                </div>
              `).join("")}
            </div>
            <div class="pt-3">
              <a href="kontak.html" class="inline-flex items-center gap-2 bg-[#0B192C] hover:bg-amber-500 hover:text-[#0B192C] text-white font-bold px-5 py-2.5 rounded text-xs uppercase tracking-wider transition">
                Konsultasi RAB & Survei Lokasi <i class="fa-solid fa-arrow-right"></i>
              </a>
            </div>
          </div>
        </div>
      `).join("");
    });
  </script>
</body>
</html>
